
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMERCE LEAGUE</title>
    <meta name="description" content="Commerce League — Learn Commerce. Build Your Future.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 28px 8%;
            border-bottom: 1px solid #222;
        }

        header h2 {
            letter-spacing: 3px;
            font-size: 20px;
        }

        main {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }

        .tag {
            color: #aaa;
            letter-spacing: 4px;
            font-size: 12px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 9vw, 90px);
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        main p {
            color: #bbb;
            font-size: 18px;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            border-top: 1px solid #222;
            font-size: 13px;
        }

        footer p + p {
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h2>COMMERCE LEAGUE</h2>
    </header>

    <main>
        <div class="tag">WELCOME TO THE FUTURE OF COMMERCE</div>
        <h1>COMMERCE<br>LEAGUE</h1>
        <p>Learn Commerce. Build Your Future.</p>
        <p>A new journey in commerce education begins here.</p>
    </main>

    <footer>
        <p>© 2026 COMMERCE LEAGUE. All rights reserved.</p>
        <p>Built step by step. More coming soon.</p>
    </footer>
</body>
</html>
